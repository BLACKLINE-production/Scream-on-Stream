<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SoS Overlay</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
    }
    .stage {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    .stage video {
      width: 100%; height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage"></div>
  <script>
    (function () {
      const stage = document.getElementById('stage');
      const POLL_MS = 300;
      const WATCHDOG_MS = 20000;

      let baselineSeq = null;
      let watchdogTimer = null;
      let currentEl = null;

      function clearStage() {
        if (watchdogTimer) {
          clearTimeout(watchdogTimer);
          watchdogTimer = null;
        }
        if (currentEl) {
          try { currentEl.pause(); } catch (e) {}
          currentEl.remove();
          currentEl = null;
        }
        stage.innerHTML = '';
      }

      function armWatchdog() {
        if (watchdogTimer) clearTimeout(watchdogTimer);
        watchdogTimer = setTimeout(clearStage, WATCHDOG_MS);
      }

      function playMedia(event) {
        clearStage();
        if (!event || !event.url) return;

        const el = document.createElement(event.kind === 'video' ? 'video' : 'audio');
        el.src = event.url;
        el.autoplay = true;
        el.controls = false;
        el.volume = Math.min(1, Math.max(0, typeof event.volume === 'number' ? event.volume : 1));
        el.style.display = event.kind === 'video' ? 'block' : 'none';

        el.addEventListener('ended', clearStage);
        el.addEventListener('error', clearStage);

        currentEl = el;
        stage.appendChild(el);
        armWatchdog();

        el.play().catch(clearStage);
      }

      async function poll() {
        try {
          const res = await fetch('/api/scare-state', { cache: 'no-store' });
          const data = await res.json();

          if (baselineSeq === null) {
            baselineSeq = data.seq;
          } else if (data.seq !== baselineSeq) {
            baselineSeq = data.seq;
            if (data.event && data.event.type === 'play') {
              playMedia(data.event);
            } else if (data.event && data.event.type === 'stop') {
              clearStage();
            }
          }
        } catch (e) {
          // App not reachable yet (e.g. still starting up) — keep retrying.
        }
        setTimeout(poll, POLL_MS);
      }

      poll();
    })();
  </script>
</body>
</html>
