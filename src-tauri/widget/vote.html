<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>SoS Vote Widget</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --accent: #8A2BE2;
    --accent2: #C71585;
    --card-bg: #161616;
    --card-border: rgba(138, 43, 226, 0.55);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: 'Inter', 'Segoe UI', sans-serif;
  }
  #root {
    width: 400px;
    padding: 8px 16px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity .35s ease, transform .35s ease;
  }
  #root.visible { opacity: 1; transform: translateY(0); }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 24px;
    letter-spacing: 1px;
    text-align: center;
    line-height: 1.15;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 10px rgba(138, 43, 226, .55));
  }
  .title small {
    display: block;
    margin-top: 1.5px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #c9c9c9;
    -webkit-text-fill-color: #c9c9c9;
  }
  .subtitle {
    font-size: 11px;
    color: #d6d6d6;
    text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,.85);
  }
  .total-votes {
    font-size: 10px;
    font-weight: 600;
    color: #8A2BE2;
    text-align: center;
    margin-top: -4px;
    text-shadow: 0 1px 3px rgba(0,0,0,.85);
  }
  .candidates { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .candidate {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 12px;
    padding: 10px 14px;
    box-shadow: 0 0 14px rgba(138, 43, 226, .25);
    transition: border-color .3s ease, box-shadow .3s ease;
  }
  .candidate.leading {
    border-color: var(--accent2);
    box-shadow: 0 0 22px rgba(199, 21, 133, .65), 0 0 12px rgba(138, 43, 226, .4);
  }
  .fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 33.333%;
    background: linear-gradient(90deg, rgba(138,43,226,.4), rgba(199,21,133,.4));
    transition: width .6s cubic-bezier(.4,0,.2,1);
    z-index: 0;
  }
  .badge {
    position: relative; z-index: 1;
    flex-shrink: 0;
    width: 24px; height: 24px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; color: #fff;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    box-shadow: 0 0 8px rgba(138, 43, 226, .6);
  }
  .name {
    position: relative; z-index: 1;
    font-weight: 700; font-size: 14.5px; color: #fff;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hint {
    font-size: 10px;
    color: #bdbdbd;
    text-align: center;
    line-height: 1.45;
    text-shadow: 0 1px 3px rgba(0,0,0,.85);
    padding: 0 6px;
  }
</style>
</head>
<body>
  <div id="root">
    <div class="title" id="title">Scream<small>ON STREAM</small></div>
    <div class="subtitle" id="subtitle"></div>
    <div class="total-votes" id="totalVotes"></div>
    <div class="candidates" id="candidates"></div>
    <div class="hint" id="hint"></div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const lang = params.get('lang') === 'en' ? 'en' : 'ru';

  const TEXT = {
    ru: {
      subtitle: 'Голосование за следующий скример',
      hint: 'Напиши в чат нужную цифру. Пожалуйста, не пиши название скримера — не порти сюрприз остальным 🤫',
      totalVotes: (n) => `Всего голосов: ${n}`,
    },
    en: {
      subtitle: 'Vote for the next scare',
      hint: "Type the number in chat. Please don't type the screamer's name — don't spoil the surprise 🤫",
      totalVotes: (n) => `Total votes: ${n}`,
    },
  };

  document.getElementById('subtitle').textContent = TEXT[lang].subtitle;
  document.getElementById('hint').textContent = TEXT[lang].hint;

  const root = document.getElementById('root');
  const candidatesEl = document.getElementById('candidates');
  const totalVotesEl = document.getElementById('totalVotes');
  let wasActive = false;

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function stripExt(fileName) {
    const idx = fileName.lastIndexOf('.');
    return idx > 0 ? fileName.slice(0, idx) : fileName;
  }

  function kindEmoji(kind) {
    return kind === 'video' ? '🎥' : '🔊';
  }

  function render(state) {
    const isActive = state.active && state.candidates.length === 3;
    root.classList.toggle('visible', isActive);
    if (!isActive) {
      wasActive = false;
      return;
    }

    if (!wasActive) {
      candidatesEl.innerHTML = state.candidates.map((c, i) => `
        <div class="candidate">
          <div class="fill" id="fill-${i}"></div>
          <div class="badge">${i + 1}</div>
          <div class="name">${kindEmoji(c.kind)} ${escapeHtml(stripExt(c.name))}</div>
        </div>
      `).join('');
    }
    wasActive = true;

    const total = state.votes.reduce((a, b) => a + b, 0);
    totalVotesEl.textContent = TEXT[lang].totalVotes(total);

    const maxVotes = Math.max(...state.votes);
    state.candidates.forEach((_, i) => {
      const pct = total > 0 ? (state.votes[i] / total) * 100 : 100 / 3;
      const fillEl = document.getElementById(`fill-${i}`);
      if (fillEl) fillEl.style.width = pct + '%';
      const candidateEl = fillEl ? fillEl.parentElement : null;
      if (candidateEl) {
        candidateEl.classList.toggle('leading', total > 0 && state.votes[i] === maxVotes);
      }
    });
  }

  async function poll() {
    try {
      const res = await fetch('/api/vote-state', { cache: 'no-store' });
      const state = await res.json();
      render(state);
    } catch (e) {
    }
    setTimeout(poll, 800);
  }

  poll();
</script>
</body>
</html>
